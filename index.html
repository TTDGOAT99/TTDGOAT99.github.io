<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>TTDGOAT99 and games</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <header>
        <h1>Welcome to TTDGOAT99 and games</h1>
        <p>Hosted beautifully on GitHub Pages!</p>
    </header>

    <main style="text-align: center; margin-top: 2rem;">
        <p>Play Dirt Jumper right below!</p>
        
        <!-- Unity WebGL Container -->
        <div id="unity-container" class="unity-desktop" style="position: relative; width: 960px; height: 600px; margin: 0 auto;">
          <canvas id="unity-canvas" width=960 height=600 tabindex="-1" style="background: #231f20; width: 100%; height: 100%;"></canvas>
          <div id="unity-loading-bar" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none;">
            <div id="unity-logo" style="width: 154px; height: 130px; margin: 0 auto 10px;"></div>
            <div id="unity-progress-bar-empty" style="width: 200px; height: 18px; margin: 0 auto; background: url('TemplateData/progress-bar-empty-dark.png') no-repeat center;">
              <div id="unity-progress-bar-full" style="width: 0%; height: 100%; background: url('TemplateData/progress-bar-full-dark.png') no-repeat center;"></div>
            </div>
          </div>
          <div id="unity-warning" style="position: absolute; left: 50%; top: 5%; transform: translate(-50%, 0); background: red; padding: 10px; display: none;"></div>
          <div id="unity-footer" style="width: 100%; height: 38px; position: relative;">
            <div id="unity-webgl-logo" style="float: left; width: 204px; height: 38px; background: url('TemplateData/webgl-logo.png') no-repeat center;"></div>
            <div id="unity-fullscreen-button" style="float: right; width: 38px; height: 38px; background: url('TemplateData/fullscreen-button.png') no-repeat center; cursor: pointer;"></div>
            <div id="unity-build-title" style="float: right; margin-right: 10px; line-height: 38px; font-family: sans-serif; color: white;">Dirt Jumper</div>
          </div>
        </div>
    </main>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Dirt Jumper.loader.js";
      var config = {
        dataUrl: buildUrl + "/Dirt Jumper.data.unityweb",
        frameworkUrl: buildUrl + "/Dirt Jumper.framework.js.unityweb",
        codeUrl: buildUrl + "/Dirt Jumper.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Dirt Jumper",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                loadingBar.style.display = "none";
                fullscreenButton.onclick = () => {
                  unityInstance.SetFullscreen(1);
                };
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);
    </script>
  </body>
</html>
